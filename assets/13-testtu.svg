<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="981" viewBox="0 0 1920 981"><title>TestTU keeps the short test configuration</title><desc>Tests may still assign TU.ClangTidyProvider. build() wraps it in a local module; inputs() only forwards explicit modules. ClangTidyProvider and FeatureModules are mutually exclusive in TestTU::build(). Mixed-module tests and direct inputs() callers use an explicit module set. This is a deliberate test-helper boundary. TU.ClangTidyProvider is a build()-only convenience adapter. Mixed modules and direct inputs() calls use an explicit set; TestTU.h is unchanged.</desc><rect width="1920" height="981" fill="#f4f3ef"/><text x="48" y="42" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#496272" letter-spacing="2">CLANGD / CLANG-TIDY MIGRATION     13 / 19</text><text x="48" y="94" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#142c3e" font-weight="700">TestTU keeps the short test configuration</text><text x="48" y="133" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#496272" >Tests may still assign TU.ClangTidyProvider. build() wraps it in a local module; inputs() only forwards explicit modules. ClangTidyProvider</text><text x="48" y="157" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#496272" >and FeatureModules are mutually exclusive in TestTU::build(). Mixed-module tests and direct inputs() callers use an explicit module set. This</text><text x="48" y="181" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#496272" >is a deliberate test-helper boundary.</text><text x="48" y="246" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#294b48" font-weight="700">TEST HELPER ADAPTER</text><rect x="400" y="233" width="14" height="14" fill="#eac17a"/><text x="424" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#496272" >Removed here (diff)</text><rect x="680" y="233" width="14" height="14" fill="#68d6bd"/><text x="704" y="246"