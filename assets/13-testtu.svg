<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="963" viewBox="0 0 1920 963"><title>TestTU keeps the short test configuration</title><desc>Tests may still assign TU.ClangTidyProvider. build() wraps it in a local module; inputs() only forwards explicit modules. ClangTidyProvider and FeatureModules are mutually exclusive in TestTU::build(). Mixed-module tests and direct inputs() callers use an explicit module set. This is a deliberate test-helper boundary.</desc><rect width="1920" height="963" fill="#f4f3ef"/><text x="48" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" letter-spacing="2" style="font-size:14px">CLANGD / CLANG-TIDY MIGRATION     13 / 19</text><text x="48" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" font-weight="700" style="fill:#142c3e;font-size:34px">TestTU keeps the short test configuration</text><text x="48" y="133" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:18px">Tests may still assign TU.ClangTidyProvider. build() wraps it in a local module; inputs() only forwards explicit modules.</text><text x="48" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" font-weight="700" style="fill:#294b48;font-size:13px">TEST ADAPTER</text><rect x="330" y="185" width="14" height="14" fill="#eac17a"/><text x="354" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Removed here (diff)</text><rect x="570" y="185" width="14" height="14" fill="#68d6bd"/><text x="594" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Added here (diff)</text><rect x="810" y="185" width="14" height="14" fill="#718397"/><text x="834" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Unchanged context</text><text x="1120" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#49