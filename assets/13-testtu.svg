ocation(Inputs, Diags);</text><rect x="1032" y="708" width="828" height="22" fill="#203044"/><text x="1077" y="724" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">132</text><text x="1093" y="724" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  assert(CI &amp;&amp; &quot;Failed to build compilation invocation.&quot;);</text><rect x="1032" y="730" width="828" height="22" fill="#203044"/><text x="1077" y="746" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">133</text><text x="1093" y="746" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  if (OverlayRealFileSystemForModules)</text><path d="M 922 514 H 996 M 984 504 L 996 514 L 984 524" fill="none" stroke="#466a78" stroke-width="3"/><text x="960" y="546" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" text-anchor="middle" style="font-size:12px">MAP</text><text x="48" y="845" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:17px">ClangTidyProvider and FeatureModules are mutually exclusive in TestTU::build().</text><text x="48" y="870" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:17px">Mixed-module tests and direct inputs() callers use an explicit module set. This is a deliberate test-helper boundary.</text><text x="48" y="941" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:13px;fill:#657b87">Colors follow git diff · unchanged context is gray · arrows map responsibilities, not entire excerpts</text></svg>