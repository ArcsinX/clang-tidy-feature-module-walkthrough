<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1259" viewBox="0 0 1920 1259"><title>Build integration and focused regression additions</title><desc>CMake and GN compile the module. Five unit regressions and one lit test protect the migration. Existing tidy diagnostics, token-buffer and preamble replay tests are reused rather than duplicated. New coverage preserves zero-check semantics; GN/lit additions are in figure 18.</desc><rect width="1920" height="1259" fill="#f4f3ef"/><text x="48" y="42" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" letter-spacing="2" style="font-size:14px">CLANGD / CLANG-TIDY MIGRATION     16 / 19</text><text x="48" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" font-weight="700" style="fill:#142c3e;font-size:34px">Build integration and focused regression additions</text><text x="48" y="133" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:18px">CMake and GN compile the module. Five unit regressions and one lit test protect the migration.</text><text x="48" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" font-weight="700" style="fill:#294b48;font-size:13px">NEW SUPPORT</text><rect x="330" y="185" width="14" height="14" fill="#eac17a"/><text x="354" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Removed here (diff)</text><rect x="570" y="185" width="14" height="14" fill="#68d6bd"/><text x="594" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Added here (diff)</text><rect x="810" y="185" width="14" height="14" fill="#718397"/><text x="834" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Unchanged context</text><text x="1120" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" style="font-size:14px">Arrows map responsibil