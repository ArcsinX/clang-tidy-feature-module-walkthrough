ight="22" fill="#153e3c"/><text x="1047" y="706" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="706" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">833</text><text x="1093" y="706" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  };</text><rect x="1032" y="712" width="828" height="22" fill="#153e3c"/><text x="1047" y="728" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="728" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">834</text><text x="1093" y="728" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  auto Warning = AllOf(diagName(&quot;-Wunused-function&quot;), diagSource(Diag::Clang),</text><rect x="1032" y="734" width="828" height="22" fill="#153e3c"/><text x="1047" y="750" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="750" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">835</text><text x="1093" y="750" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">                       diagSeverity(DiagnosticsEngine::Warning));</text><rect x="1032" y="756" width="828" height="22" fill="#153e3c"/><text x="1047" y="772" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="772" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">836</text><text x="1093" y="772" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  EXPECT_THAT(TU.build().getDiagnostics(), ElementsAre(Warning));</text><rect x="1032" y="778" width="828" height="22" fill="#153e3c"/><text x="1047" y="794" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="794" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">837</text><text x="1093" y="794" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7"></text><rect x="1032" y="800" width="828" height="22" fill="#153e3c"/><text x="1047" y="816" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="816" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">838</text><text x="1093" y="816" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  // Without tidy checks, NOLINT and WarningsAsErrors don&apos;t affect warnings.</text><rect x="1032" y="822" width="828" height="22" fill="#153e3c"/><text x="1047" y="838" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="838" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">839</text><text x="1093" y="838" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  TU.Code =</text><rect x="1032" y="844" width="828" height="22" fill="#153e3c"/><text x="1047" y="860" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="860" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">840</text><text x="1093" y="860" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">      &quot;static void foo() {} // NOLINT(clang-diagnostic-unused-function)\n&quot;;</text><rect x="1032" y="866" width="828" height="22" fill="#153e3c"/><text x="1047" y="882" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#68d6bd" text-anchor="middle">+</text><text x="1077" y="882" text-anchor="end" fon