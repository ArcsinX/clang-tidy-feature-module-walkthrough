<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1060" viewBox="0 0 1920 1060"><title>Clang-tidy moves behind FeatureModule lifecycle hooks</title><rect x="0" y="0" width="1920" height="1060" rx="0" fill="#f4f3ef"/><text x="64" y="48" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#586d7a" letter-spacing="2">CLANGD / REFACTORING MAP</text><text x="64" y="106" font-family="Arial,Helvetica,sans-serif" font-size="40" fill="#142c3e" font-weight="700">Clang-tidy moves behind FeatureModule hooks</text><text x="64" y="144" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#496272" >18f9e623e4c8  →  c109083b09c6   ·   code moves + lifecycle adapters + caller rewiring</text><text x="85" y="195" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#816027" font-weight="700" letter-spacing="1">BEFORE: CORE IMPLEMENTATION</text><text x="1060" y="195" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#187862" font-weight="700" letter-spacing="1">AFTER: ClangTidyFeatureModule / TidyASTListener</text><rect x="64" y="216" width="795" height="88" rx="12" fill="#142131"/><rect x="1040" y="216" width="815" height="88" rx="12" fill="#142131"/><rect x="64" y="216" width="5" height="88" rx="0" fill="#eac17a"/><rect x="1040" y="216" width="5" height="88" rx="0" fill="#68d6bd"/><text x="89" y="252" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e5edf7" >ParsedAST::build — options + -W handling</text><text x="1065" y="250" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">beforeBeginSourceFile(CI)</text><text x="1065" y="278" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bccbd9" >Runs before frontend initialization</text><path d="M 885 260 H 1010 l -12 -10 m 12 10 l -12 10" fill="none" stroke="#466a78" stroke-width="3"/><rect x="64" y="320" width="795" height="88" rx="12" fill="#142131"/><rect x="1040" y="320" width="815" height="88" rx="12" fill="#142131"/><rect x="64" y="320" width="5" height="88" rx="0" fill="#eac17a"/><rect x="1040" y="320" width="5" height="88" rx="0" fill="#68d6bd"/><text x="89" y="356" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e5edf7" >ParsedAST::build — context + check setup</text><text x="1065" y="354" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">beforePPCallbacks(CI)</text><text x="1065" y="382" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bccbd9" >Registers callbacks before preamble replay</text><path d="M 885 364 H 1010 l -12 -10 m 12 10 l -12 10" fill="none" stroke="#466a78" stroke-width="3"/><rect x="64" y="424" width="795" height="88" rx="12" fill="#142131"/><rect x="1040" y="424" width="815" height="88" rx="12" fill="#142131"/><rect x="64" y="424" width="5" height="88" rx="0" fill="#eac17a"/><rect x="1040" y="424" width="5" height="88" rx="0" fill="#bdadfa"/><text x="89" y="460" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e5edf7" >No tidy ASTConsumer wrapper</text><text x="1065" y="458" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">beforeExecute(CI)</text><text x="1065" y="486" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bccbd9" >NEW: multiplex original + deferred tidy consumer</text><path d="M 885 468 H 1010 l -12 -10 m 12 10 l -12 10" fill="none" stroke="#466a78" stroke-width="3"/><rect x="64" y="528" width="795" height="88" rx="12" fill="#142131"/><rect x="1040" y="528" width="815" height="88" rx="12" fill="#142131"/><rect x="64" y="528" width="5" height="88" rx="0" fill="#eac17a"/><rect x="1040" y="528" width="5" height="88" rx="0" fill="#68d6bd"/><text x="89" y="564" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e5edf7" >ParsedAST::build — CTFinder.matchAST(...)</text><text x="1065" y="562" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">afterExecute(CI)</text><text x="1065" y="590" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bccbd9" >Matches after token collection + traversal restriction</text><path d="M 885 572 H 1010 l -12 -10 m 12 10 l -12 10" fill="none" stroke="#466a78" stroke-width="3"/><rect x="64" y="632" width="795" height="88" rx="12" fill="#142131"/><rect x="1040" y="632" width="815" height="88" rx="12" fill="#142131"/><rect x="64" y="632" width="5" height="88" rx="0" fill="#eac17a"/><rect x="1040" y="632" width="5" height="88" rx="0" fill="#68d6bd"/><text x="89" y="668" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e5edf7" >ParsedAST level adjuster — tidy policy</text><text x="1065" y="666" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">sawDiagnostic(Info, D)</text><text x="1065" y="694" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bccbd9" >Suppression, NOLINT and severity; names/source too</text><path d="M 885 676 H 1010 l -12 -10 m 12 10 l -12 10" fill="none" stroke="#466a78" stroke-width="3"/><rect x="64" y="736" width="795" height="88" rx="12" fill="#142131"/><rect x="1040" y="736" width="815" height="88" rx="12" fill="#142131"/><rect x="64" y="736" width="5" height="88" rx="0" fill="#eac17a"/><rect x="1040" y="736" width="5" height="88" rx="0" fill="#68d6bd"/><text x="89" y="772" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e5edf7" >StoreDiags — tidy cleanup + tags</text><text x="1065" y="770" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">finalizeDiagnostic(D)</text><text x="1065" y="798" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#bccbd9" >Cleans messages, notes and fixes; adds tidy tags</text><path d="M 885 780 H 1010 l -12 -10 m 12 10 l -12 10" fill="none" stroke="#466a78" stroke-width="3"/><rect x="64" y="866" width="1792" height="122" rx="12" fill="#e3e8e5"/><text x="86" y="900" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#294b48" font-weight="700" letter-spacing="1">OWNERSHIP</text><text x="86" y="933" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#203b48" font-weight="600">ClangdMain → FeatureModuleSet → ClangTidyFeatureModule → per-build listener</text><text x="86" y="963" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#496272" >The hook interface already exists on main. IncludeFixer, token collection and frontend orchestration remain in the core.</text><text x="64" y="1030" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#657b87" >Conceptual ownership map (not a line diff). In the code figures, unchanged context is gray; only diff lines are colored.</text></svg>
