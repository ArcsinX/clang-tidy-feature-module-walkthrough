<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1000" viewBox="0 0 1920 1000"><title>Clang-tidy moves behind existing FeatureModule hooks</title><desc>Tidy responsibilities move with their original comments. Core parsing orchestration stays in place; matching remains a direct MatchFinder call.</desc><rect width="1920" height="1000" fill="#f4f3ef"/><text x="48" y="45" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#496272" letter-spacing="2">CLANGD / CLANG-TIDY MIGRATION</text><text x="48" y="105" font-family="Arial,Helvetica,sans-serif" font-size="40" fill="#142c3e" font-weight="700">Moving clang-tidy into a FeatureModule</text><text x="48" y="150" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#496272" >101584320859 → c64f1fca38c6   |   17 changed files   |   +624 / −408</text><rect x="48" y="195" width="852" height="465" rx="14" fill="#142131"/><text x="76" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#eac17a" font-weight="700">BEFORE: TIDY EMBEDDED IN CORE</text><rect x="1020" y="195" width="852" height="465" rx="14" fill="#142131"/><text x="1048" y="237" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#68d6bd" font-weight="700">AFTER: CLANGTIDYFEATUREMODULE</text><a href="https://github.com/ArcsinX/llvm-project/blob/101584320859c12c84929443136e9deb54de544a/clang-tools-extra/clangd/ParsedAST.cpp"><text x="76" y="290" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#eac17a" font-weight="700">ParsedAST.cpp</text></a><text x="76" y="331" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e4edf7" >Read .clang-tidy and apply warning options</text><text x="76" y="371" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e4edf7" >Construct context, checks and matchers</text><text x="76" y="411" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e4edf7" >Run MatchFinder after tokens and traversal scope</text><text x="76" y="451" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e4edf7" >Filter diagnostics: suppression, NOLINT, severity</text><a href="https://github.com/ArcsinX/llvm-project/blob/101584320859c12c84929443136e9deb54de544a/clang-tools-extra/clangd/Diagnostics.cpp"><text x="76" y="530" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#eac17a" font-weight="700">Diagnostics.cpp</text></a><text x="76" y="570" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e4edf7" >Tidy names, message cleanup and tags</text><a href="https://github.com/ArcsinX/llvm-project/blob/c64f1fca38c610faa448c14c5336808087b1996e/clang-tools-extra/clangd/ClangTidyFeatureModule.cpp"><text x="1048" y="290" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#68d6bd" font-weight="700">Per-build TidyASTListener</text></a><text x="1048" y="335" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e4edf7" >beforeBeginSourceFile → options and warning flags</text><text x="1048" y="381" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e4edf7" >beforePPCallbacks → checks, PP callbacks, matchers</text><text x="1048" y="427" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e4edf7" >afterExecute → Finder.matchAST(CI.getASTContext())</text><text x="1048" y="473" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e4edf7" >sawDiagnostic → tidy suppression and severity</text><text x="1048" y="519" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#e4edf7" >finalizeDiagnostic → names, message cleanup, tags</text><path d="M 925 425 H 993 M 980 413 L 993 425 L 980 437" fill="none" stroke="#329982" stroke-width="4"/><text x="940" y="480" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#294b48" text-anchor="middle" font-weight="700">MOVE</text><text x="940" y="502" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#294b48" text-anchor="middle">+ comments</text><rect x="48" y="700" width="1824" height="240" rx="14" fill="#e3ebe5"/><text x="76" y="745" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#294b48" font-weight="700">STAYS IN CORE</text><text x="76" y="788" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#20364b" >Frontend startup • token collection • traversal scope • IncludeFixer • lifecycle dispatch</text><text x="76" y="832" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#20364b" >No new AST-consumer wrapper. FeatureModule.h, Preamble.cpp and TestTU.h are unchanged.</text><text x="76" y="875" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#20364b" >Existing regression tests are reused. One provider-swap test is added; no lit test is added.</text><text x="48" y="978" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#496272" >Original explanatory comments and existing FIXMEs move with the code; see figure 19.</text></svg>