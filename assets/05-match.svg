<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="955" viewBox="0 0 1920 955"><title>AST matching is a direct afterExecute call</title><desc>The same MatchFinder call moves from ParsedAST into afterExecute(). Tokens are collected and traversal scope is restricted first, as before. Token finalization, traversal restriction and hook dispatch stay in ParsedAST. There is no deferred consumer, consumer replacement, or reinitialization.</desc><rect width="1920" height="955" fill="#f4f3ef"/><text x="48" y="42" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#496272" letter-spacing="2">CLANGD / CLANG-TIDY MIGRATION     05 / 19</text><text x="48" y="94" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#142c3e" font-weight="700">AST matching is a direct afterExecute call</text><text x="48" y="133" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#496272" >The same MatchFinder call moves from ParsedAST into afterExecute(). Tokens are collected and traversal scope is restricted first, as before.</text><text x="48" y="198" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#294b48" font-weight="700">MOVE + ADAPT</text><rect x="400" y="185" width="14" height="14" fill="#eac17a"/><text x="424" y="198" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#496272" >Removed here (diff)</text><rect x="680" y="185" width="14" height="14" fill="#68d6bd"/><text x="704" y="198" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#496272" >Added here (diff)</text><rect x="950" y="185" width="14" height="14" fill="#718397"/><text x="974" y="198" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#496272" >Unchanged context</text><rect x="48" y="225" width="852" height="586" rx="12" fill="#142131"/><text x="68" y="252" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#eac17a" font-weight="700">BEFORE / 101584320859</text><a href="https://github.com/ArcsinX/llvm-project/blob/101584320859c12c84929443136e9deb54de544a/clang-tools-extra/clangd/ParsedAST.cpp#L770"><title>Open exact source on GitHub</title><text x="67" y="290" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#eac17a" font-weight="600">ParsedAST.cpp</text></a><rect x="60" y="307" width="828" height="22" fill="#203044"/><text x="105" y="323" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">770</text><text x="121" y="323" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  // We have to consume the tokens before running clang-tidy to avoid collecting</text><rect x="60" y="329" width="828" height="22" fill="#203044"/><text x="105" y="345" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">771</text><text x="121" y="345" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  // tokens from running the preprocessor inside the checks (only</text><rect x="60" y="351" width="828" height="22" fill="#203044"/><text x="105" y="367" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">772</text><text x="121" y="367" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  // modernize-use-trailing-return-type does that today).</text><rect x="60" y="373" width="828" height="22" fill="#203044"/><text x="105" y="389" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">773</text><text x="121" y="389" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  syntax::TokenBuffer Tokens = std::move(CollectTokens).consume();</text><rect x="60" y="395" width="828" height="22" fill="#203044"/><text x="105" y="411" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">774</text><text x="121" y="411" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  // Makes SelectionTree build much faster.</text><rect x="60" y="417" width="828" height="22" fill="#203044"/><text x="105" y="433" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">775</text><text x="121" y="433" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  Tokens.indexExpandedTokens();</text><rect x="60" y="439" width="828" height="22" fill="#203044"/><text x="105" y="455" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">776</text><text x="121" y="455" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  std::vector&lt;Decl *&gt; ParsedDecls = Action-&gt;takeTopLevelDecls();</text><rect x="60" y="461" width="828" height="22" fill="#203044"/><text x="105" y="477" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">777</text><text x="121" y="477" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  // AST traversals should exclude the preamble, to avoid performance cliffs.</text><rect x="60" y="483" width="828" height="22" fill="#203044"/><text x="105" y="499" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">778</text><text x="121" y="499" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  Clang-&gt;getASTContext().setTraversalScope(ParsedDecls);</text><rect x="60" y="505" width="828" height="22" fill="#403627"/><text x="75" y="521" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#eac17a" text-anchor="middle">−</text><text x="105" y="521" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">779</text><text x="121" y="521" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">  if (!CTChecks.empty()) {</text><rect x="60" y="527" width="828" height="22" fill="#403627"/><text x="75" y="543" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#eac17a" text-anchor="middle">−</text><text x="105" y="543" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">780</text><text x="121" y="543" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">    // Run the AST-dependent part of the clang-tidy checks.</text><rect x="60" y="549" width="828" height="22" fill="#403627"/><text x="75" y="565" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#eac17a" text-anchor="middle">−</text><text x="105" y="565" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">781</text><text x="121" y="565" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">    // (The preprocessor part ran already, via PPCallbacks).</text><rect x="60" y="571" width="828" height="22" fill="#403627"/><text x="75" y="587" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#eac17a" text-anchor="middle">−</text><text x="105" y="587" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">782</text><text x="121" y="587" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">    trace::Span Tracer(&quot;ClangTidyMatch&quot;);</text><rect x="60" y="593" width="828" height="22" fill="#403627"/><text x="75" y="609" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#eac17a" text-anchor="middle">−</text><text x="105" y="609" text-anchor="end" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8093a5">783</text><text x="121" y="609" xml:space="preserve" font-family="Menlo,Consolas,monospace" font-size="14" fill="#e4edf7">    CTFinder.matchAST(Clang-&gt;getASTContext());</text><rect x="60" y="615" width="828" height="22" fill="#403627"/><text x="75" y="631" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#eac17a" text-anchor=